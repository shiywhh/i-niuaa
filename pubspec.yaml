name: nuaa_eams
description: "NUAA 教务系统客户端（个人使用）"
publish_to: 'none'
version: 2.2.0+3

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  cookie_jar: ^4.0.8
  dio_cookie_manager: ^3.1.1
  encrypt: ^5.0.3
  html: ^0.15.5
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  barcode_widget: ^2.0.4
  crypto: ^3.0.7
  url_launcher: ^6.3.0
  package_info_plus: ^9.0.1
  file_selector: ^1.1.0
  share_plus: ^12.0.2
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  ios: true
  remove_alpha_ios: true
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256

flutter:
  uses-material-design: true

  assets:
    - assets/images/school_badge.png

  fonts:
    - family: HarmonyOS Sans SC
      fonts:
        - asset: assets/fonts/HarmonyOS_SansSC_Regular.ttf
        - asset: assets/fonts/HarmonyOS_SansSC_Medium.ttf
          weight: 500
        - asset: assets/fonts/HarmonyOS_SansSC_Bold.ttf
          weight: 700
